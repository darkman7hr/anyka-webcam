# /mnt/camweb/time/time.conf
#
# What the clock supervisor does, and the timezone everyone else is told to use.
# Sourced by /bin/sh from run_time.sh; run_akrtsp.sh and the web runner read
# TZ_STR out of it too, so there is one place that says what zone this camera is
# in.

# NTP peers, tried in order, one at a time. All three were reachable from this
# camera and each set the clock on the first attempt; the LAN gateway (192.168.10.1)
# does not answer NTP at all, so it is not listed.
NTP_PEERS="162.159.200.1 216.239.35.8 pool.ntp.org"

# Seconds between re-syncs once the clock has been confirmed. This board has no
# RTC (no /sys/class/rtc, no battery), so the clock is whatever NTP last said plus
# the drift of a cheap crystal: 15 min keeps a clock read off to the second honest
# and keeps the correction under a second, which matters because akrtsp counts RTP
# timestamps per frame and only creeps them forward against the wall clock.
SYNC_SECS=900

# Retry delay while the clock has never been confirmed (boot, Wi-Fi not up yet).
# Short, because the burned-in date overlay is the thing waiting on it.
BOOT_RETRY_SECS=20

# How long to wait for one peer before moving on to the next.
NTP_TIMEOUT=12

# POSIX TZ rule. uClibc on this board has no zoneinfo database, so the rule has to
# be spelled out rather than named: CET-1CEST with the EU last-Sunday switches,
# which is the zone this network is in and the same one the build host runs. The
# vendor environment sets TZ=GMT-08:00 (its own "timezone:8"); this overrides it
# for everything camweb starts.
TZ_STR="CET-1CEST,M3.5.0,M10.5.0/3"

# An epoch below this is not a date, it is an unset clock (boot-time 1970 plus
# uptime). Anything under it is reported as unsynced and the overlay says so
# instead of burning a fake date into a recording. 1230768000 = 2009-01-01.
MIN_VALID_EPOCH=1230768000
