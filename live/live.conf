# /mnt/camweb/live/live.conf
#
# Configuration for the on-demand preview relay (go2rtc) used by the camweb UI's
# "Live view" panel. Sourced as a shell file by both cgi-bin/api and
# run_live.sh, so keep the values simple: KEY=value, no quoting games.
#
# Nothing here starts at boot. The relay exists only while a browser is asking
# for it, and it tears itself down LIVE_IDLE_S seconds after the last viewer
# leaves. Measured on this board (36 MB, no swap): 7.1 MB resident idle, ~11.8 MB
# while a viewer is pulling frames, and it never took free memory below ~2.2 MB.

# Master switch. 0 = the UI's Live button refuses and says why.
LIVE_EN=1

# Where the video comes from. This is the vendor's own RTSP server, which only
# The vendor RTSP server answers absolute request-URIs on /vs0 (1280x720 H.264 +
# PCMA) and /vs1 (640x480).
#
# The preview uses /vs1, and that is a measured choice rather than a taste one.
# With /vs0 the relay's RSS reached ~13 MB and the browser never drew a frame:
# one ARM9 core has to run the vendor encoder, go2rtc's RTSP reader, the fMP4
# muxer, this box's CGI-per-request web server, and Chrome's H.264 decoder at the
# same time, and at 720p it ran out. /vs1 moves the same pipeline down to 640x480
# and leaves the camera able to answer its own page while streaming.
LIVE_SRC=rtsp://127.0.0.1:554/vs1


# go2rtc's own ports. 1984 is its API (the page's player fetches from here),
# 8554 is an RTSP output you can point VLC at. The vendor server keeps :554 and
# is never touched.
LIVE_API_PORT=1984
LIVE_RTSP_PORT=8554

# Stop the relay this many seconds after the last viewer heartbeat.
LIVE_IDLE_S=300

# Kill the relay if AVAILABLE memory falls below this (kB). Available, not
# MemFree: this board keeps ~19 MB of its 36 MB as reclaimable page cache and
# that is normal. See availkb() in run_live.sh. On 36 MB without swap, waiting
# for the OOM killer is not a policy, so the relay removes itself instead.
LIVE_MEM_GUARD_KB=6000

# Refuse to start at all unless this much memory is available. That is go2rtc's
# peak resident set (~12 MB while streaming) plus a margin: pressing Live on an
# already-struggling camera should say no rather than try.
LIVE_START_MIN_AVAIL_KB=12000


# Go's soft memory ceiling and collector aggressiveness for the relay process.
#
# GOMEMLIMIT does not kill the process; below the real working set it turns the
# collector into a CPU hog instead. Measured RSS with one viewer pulling
# 720p through the relay is ~13 MB, and 12MiB sat right on top of that: the GC
# ran constantly on the single core, the relay fell behind, and it kept dropping
# the browser's stream (the page saw "relay closed the stream" and the supervisor
# logged restarts). 20MiB leaves the collector room while LIVE_MEM_GUARD_KB below
# is still the number that actually protects the camera.
LIVE_GOMEMLIMIT=20MiB
LIVE_GOGC=100


# go2rtc has a reproducible panic in its MP4 consumer when a viewer disconnects
# (pkg/mp4/consumer.go:82 -> pkg/core/writebuffer.go:37, nil http.ResponseWriter).
# The supervisor restarts it, but only this many times per session so that a
# crash loop can never outlast the camera.
LIVE_MAX_RESTART=5
